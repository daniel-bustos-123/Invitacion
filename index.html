<title>¿Quieres tomar un café conmigo? 🐒</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#2b2b2b;--msg:#e0202a;--yes:#009705;--no:#ff5733;--edge:#ffc0cb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a1f;--ink:#f3eef5;--msg:#ff6b73}}
:root[data-theme="dark"]{--bg:#1c1a1f;--ink:#f3eef5;--msg:#ff6b73}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{text-align:center;width:min(92vw,440px)}
#pic{display:block;margin:0 auto;max-width:78%;max-height:42vh;border-radius:18px;object-fit:contain}
h1{font-size:26px;margin:14px 0 6px}
#msg{font-size:22px;font-weight:700;color:var(--msg);min-height:1.4em;margin:0 0 12px;animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.btns{display:flex;gap:12px;justify-content:center;align-items:center;min-height:96px}
button{font:inherit;font-weight:700;color:#fff;border:2px solid var(--edge);border-radius:12px;cursor:pointer;padding:10px 22px;font-size:18px;transition:transform .12s}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:var(--yes)}
#no{background:var(--no)}
#no.run{position:fixed;z-index:5;transition:left .22s,top .22s}
#final{display:none}
#final h1{color:var(--msg);font-size:30px}
@media (prefers-reduced-motion:reduce){#msg{animation:none}#no.run{transition:none}}
</style>

var yes=document.getElementById('yes'), no=document.getElementById('no'), pic=document.getElementById('pic'),

function dodge(e){
  if(e) e.preventDefault();
  if(!no.classList.contains('run')){
    var r=no.getBoundingClientRect(); no.classList.add('run');
    no.style.left=r.left+'px'; no.style.top=r.top+'px';
  }
  var w=no.offsetWidth,h=no.offsetHeight;
  no.style.left=Math.random()*(window.innerWidth-w-16)+8+'px';
  no.style.top=Math.random()*(window.innerHeight-h-16)+8+'px';
  msg.textContent=MENSAJES[Math.min(n,MENSAJES.length-1)];
  pic.src=IMG_TRISTES[n%IMG_TRISTES.length]; pic.alt='Mono triste';
  n++;
  yes.style.fontSize=Math.min(44,18+n*3)+'px';
  yes.style.padding=(10+n*2)+'px '+(22+n*3)+'px';
}
